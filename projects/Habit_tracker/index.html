<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Habit Tracker</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="./index.css">
    <script src="./index.js" defer></script>
</head>
<body>
    <header class="habit-header">
        <h1>Daily Habit <span>Tracker</span></h1>
        <div class="progress-box">
            <span class="progress-label">Today's Progress</span>
            <span class="progress-count" id="progress-text">0% Done (0 of 0)</span>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar" style="width: 0%;"></div>
            </div>
        </div>
    </header>

    <main class="habit-main">
        <section class="form-card">
            <form id="submit-form">
                <div class="input-group">
                    <label for="habit-input">Create New Habit</label>
                    <input type="text" id="habit-input" placeholder="e.g., Read 10 Pages" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="habit-category">Category</label>
                    <select id="habit-category">
                        <option value="Personal">Personal</option>
                        <option value="Coding">Coding</option>
                        <option value="Study">Study</option>
                        <option value="Fitness">Fitness</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary" id="add-btn">
                    <span class="material-symbols-outlined">add</span> Add Habit
                </button>
            </form>
        </section>

        <section class="filter-toolbar">
            <div class="filter-pills" id="filter-pills">
                <button class="pill active" data-filter="All">All</button>
                <button class="pill" data-filter="Personal">Personal</button>
                <button class="pill" data-filter="Coding">Coding</button>
                <button class="pill" data-filter="Study">Study</button>
                <button class="pill" data-filter="Fitness">Fitness</button>
            </div>
            
            <div class="sort-wrapper">
                <label for="sort-by">Sort by:</label>
                <select id="sort-by">
                    <option value="created">Recently Added</option>
                    <option value="streak">Highest Streak</option>
                    <option value="name">Alphabetical</option>
                </select>
            </div>
        </section>

        <section class="habits-list" id="habits-container">
            <div class="habit-card">
                <div class="habit-info">
                    <h2 class="habit-title">Morning Workout</h2>
                    <span class="category-tag tag-fitness">Fitness</span>
                    <span class="streak-badge">🔥 4 Days</span>
                </div>

                <div class="week-tracker">
                    <div class="day-node">
                        <span class="day-label">Mon</span>
                        <button class="day-circle completed" title="Toggle Nov 02" data-daycount="1">
                            <span class="material-symbols-outlined">check</span>
                        </button>
                    </div>
                    <div class="day-node">
                        <span class="day-label">Tue</span>
                        <button class="day-circle completed" title="Toggle Nov 03" data-daycount="2">
                            <span class="material-symbols-outlined">check</span>
                        </button>
                    </div>
                    <div class="day-node">
                        <span class="day-label">Wed</span>
                        <button class="day-circle completed" title="Toggle Nov 04" data-daycount="3">
                            <span class="material-symbols-outlined">check</span>
                        </button>
                    </div>
                    <div class="day-node">
                        <span class="day-label">Thu</span>
                        <button class="day-circle completed" title="Toggle Nov 05" data-daycount="4">
                            <span class="material-symbols-outlined">check</span>
                        </button>
                    </div>
                    <div class="day-node">
                        <span class="day-label">Fri</span>
                        <button class="day-circle" title="Toggle Nov 06" data-daycount="5"></button>
                    </div>
                    <div class="day-node">
                        <span class="day-label">Sat</span>
                        <button class="day-circle" title="Toggle Nov 07" data-daycount="6"></button>
                    </div>
                    <div class="day-node">
                        <span class="day-label">Sun</span>
                        <button class="day-circle" title="Toggle Nov 08" data-daycount="7"></button>
                    </div>
                </div>

                <button class="btn-delete" title="Delete habit">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            </div>
        </section>
    </main>
</body>
</html>
