<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple calculator</title>
    <link rel="stylesheet" href="../calculator/index.css">
    <script src="../calculator/scripts.js" defer></script>
    <!-- <link rel="icon" href="../images/basic-calculator-small.webp" type="image/x-icon"> -->
</head>

<body>
    <h1 class="headin">Basic-Calculator</h1>
    <div class="cen">
        <div class="main_div" id="main_div">
            <div class="sub"><input type="text" class="type"></div>
            <button class="sub">1</button>
            <button class="sub">2</button>
            <button class="sub">3</button>
            <button class="sub">4</button>
            <button class="sub">5</button>
            <button class="sub">6</button>
            <button class="sub">7</button>
            <button class="sub">8</button>
            <button class="sub">9</button>
            <button class="sub">0</button>
            <button class="sub">C</button>
            <button class="sub">=</button>
            <button class="sub">+</button>
            <button class="sub">-</button>
            <button class="sub">*</button>
            <button class="sub">/</button>
        </div>
    </div>
</body>
</html>
