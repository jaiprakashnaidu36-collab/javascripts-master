    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RapidStrokes | Zen Mode</title>
    <link rel="stylesheet" href="no-time.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
        <div class="mode-bar">
            <span class="mode-item active">Zen / No Time</span>
            <span class="divider">•</span>
            <button class="word-btn active">Free</button>
            <button class="word-btn">50w</button>
            <button class="word-btn">100w</button>
        </div>

        <div class="actions">
            <button id="reset-btn" title="Restart (Tab + Enter)">↺ Restart</button>
        </div>
    </header>

    <main class="typing-container">
        <div class="zen-stats">
            <span id="stat-wpm">-- WPM</span>
            <span id="stat-acc">100% ACC</span>
            <span id="stat-count">0 words</span>
        </div>

        <div id="words-wrapper" class="words-wrapper" tabindex="0">
            <span class="word"><span class="letter correct">c</span><span class="letter correct">o</span><span class="letter correct">d</span><span class="letter correct">e</span></span>
            <span class="word current"><span class="letter current-letter">f</span><span class="letter">l</span><span class="letter">o</span><span class="letter">w</span></span>
            <span class="word"><span class="letter">s</span><span class="letter">y</span><span class="letter">s</span><span class="letter">t</span><span class="letter">e</span><span class="letter">m</span></span>
            <span class="word"><span class="letter">m</span><span class="letter">e</span><span class="letter">m</span><span class="letter">o</span><span class="letter">r</span><span class="letter">y</span></span>
            <span class="word"><span class="letter">b</span><span class="letter">u</span><span class="letter">i</span><span class="letter">l</span><span class="letter">d</span></span>
            <span class="word"><span class="letter">l</span><span class="letter">o</span><span class="letter">g</span><span class="letter">i</span><span class="letter">c</span></span>
        </div>

        <input type="text" id="typing-input" class="hidden-input" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

        <div class="shortcut-hint">
            Press <kbd>Tab</kbd> + <kbd>Enter</kbd> to restart &nbsp;|&nbsp; <kbd>Esc</kbd> to end test
        </div>
    </main>

</body>
</html>
